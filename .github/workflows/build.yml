# Build the kernel and test Shoal on macOS, Linux and Windows; optionally package the app.
# Called by ci.yml (every push / pull request) and release.yml (version tags).
name: build

on:
  workflow_call:
    inputs:
      package:
        description: build the installers (.dmg / setup .exe / .tar.gz) and test the packaged app
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: windows-x64, os: windows-2022 }
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # ---- system tools for the Fortran kernel (the same ones README lists)
      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc netcdf-fortran
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran libnetcdff-dev cmake
      - name: Toolchain (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-netcdf-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
      - name: Put UCRT64 on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      # ---- the project's Python environment, exactly as README describes it
      - name: Create .venv
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -r backend/requirements.txt
          if [ "${{ inputs.package }}" = true ]; then "$PY" -m pip install -r packaging/requirements.txt; fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:env
      - name: Build the kernel
        run: pnpm kernel
      - name: Unit tests
        run: node scripts/venv.mjs -m unittest discover -s backend/tests -t backend -v
      - name: Smoke test (source)
        run: node scripts/venv.mjs scripts/smoke_test.py
      - name: Frontend type check and build
        run: pnpm build

      # ---- packaging
      - name: Inno Setup (Windows)
        if: inputs.package && runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Package the app
        if: inputs.package
        run: node scripts/venv.mjs packaging/build_app.py --platform ${{ matrix.name }}
      - name: Smoke test (packaged app, headless)
        if: inputs.package
        shell: bash
        run: node scripts/venv.mjs scripts/smoke_test.py --app "$(cat dist/app-executable.txt)"
      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: shoal-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error
